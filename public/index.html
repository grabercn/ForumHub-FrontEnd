<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForumHub</title>
    <style>
        #root {
            opacity: 0;
            transition: opacity 1s ease-in-out; /* Fade-in duration */
            animation: fadeIn 1s ease-in-out 1s forwards; /* 2s fade-in after 10s delay */
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <center>
            <h1>Welcome to ForumHub</h1>
        <img src="./logos/BandWLogoNoBG.png" alt="ForumHub Logo" width="200" height="200" /> <br />
        <span style="font-size: 1.5em;">
            Services are starting. <br />
            <b>This will only take a moment.</b> <br/>
            You will be redirected automatically.
        </span> <br />
        </center>
    </div>
</body>
</html>
