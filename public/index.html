<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForumHub</title>
    <style>
        #root {
            opacity: 0;
            transition: opacity 0.5s ease-in-out; /* Fade-in duration */
            animation: fadeIn 1s ease-in-out 0.5s forwards; /* 2s fade-in after 10s delay */
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        If you see this, that means services are starting. <br />
        <b>This will only take a moment.</b> <br/>
        You will be redirected automatically.
    </div>
</body>
</html>
